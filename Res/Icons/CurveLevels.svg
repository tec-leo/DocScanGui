<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  viewBox="0 0 200 200"
  id="histogram">

  <!-- The <g> SVG element is a container to group other elements -->
  <g id="group-hist"
     >
    <rect id="rect1" x="5" y="95" width="25" height="100"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect2" x="35" y="20" width="25" height="175"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect3" x="65" y="125" width="20" height="70"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect4" x="90" y="155" width="20" height="40"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect5" x="115" y="135" width="25" height="60"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect6" x="145" y="20" width="25" height="175"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <rect id="rect7" x="175" y="105" width="23" height="90"
          fill="LightGray" stroke-width="6" stroke="DarkGray"/>

    <path
      fill="none"
      fill-opacity="0"
      stroke="Blue"
