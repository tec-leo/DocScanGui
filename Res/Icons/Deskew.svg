    />

    <use href="#circle-1" transform="translate (  10,  20 )" />
    <use href="#circle-1" transform="translate ( 165,  10 )" />
    <use href="#circle-1" transform="translate (  25, 170 )" />
    <use href="#circle-1" transform="translate ( 150, 155 )" />

