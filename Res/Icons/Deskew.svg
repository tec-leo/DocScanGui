<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  id="deskew"
  viewBox="0 0 200 200"
  x="0"
  y="0">
  <defs
     id="defs-1">
    <rect
      id="rect-1"
      x="25"
