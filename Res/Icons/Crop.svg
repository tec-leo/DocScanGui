<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- license: http://creativecommons.org/licenses/publicdomain -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  id="Crop"
  viewBox="0 0 200 200"
  x="0"
  y="0">
  <g
    id="graphics-1">

    <!-- outer dark gray rectangle -->
    <rect
      id="rect-1"
      x="5"
      y="5"
      height="180"
      width="180"
      fill="white"
      fill-rule="evenodd"
      stroke="DarkGray"
      stroke-width="12"
      stroke-opacity="0.8"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
    />

    <!-- inner light gray rectangle -->
    <rect
      id="rect-2"
      x="20"
      y="20"
      width="140"
      height="140"
      fill="LightGray"
      fill-rule="evenodd"
      stroke="white"
      stroke-width="10"
      stroke-opacity="0.2"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
    />

    <!-- dark blue angle -->
    <path
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="RoyalBlue"
      stroke="black"
      d="m 150 195
         h 25
         v -170
         H 5
         v 25
         H 150
         Z"
      id="path-1"
    />

    <!-- light blue angle -->
    <path
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="LightSkyBlue"
      stroke="black"
      d="m 50 60
         h -25
         v 110
         H 140
         v -25
         h -90
         z"
      id="path-2"
    />

    <!-- light blue rectangle -->
    <rect
      id="rect-1"
      x="175"
      y="145"
      height="25"
      width="25"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="LightSkyBlue"
      stroke="black"
    />

    <!-- royal blue rectangle -->
    <rect
      id="rect-2"
      x="25"
      y="0"
      height="25"
      width="25"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="RoyalBlue"
      stroke="black"
    />
  </g>
</svg>
