<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  id="rotate"
  viewBox="0 0 200 200"
  x="0"
  y="0">
  <defs
     id="defs1">
    <rect
      id="rect-1"
      x="0"
      y="70"
      height="140"
      width="110"
      fill="white"
      fill-rule="evenodd"
      stroke="Black"
      stroke-width="12"
      stroke-opacity="0.8"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
    />
    <rect
      id="rect-2"
      x="15"
      y="85"
      width="80"
      height="110"
      fill="LightGray"
      fill-rule="evenodd"
      stroke="white"
      stroke-width="10"
      stroke-opacity="0.2"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
    />
  </defs>

    <rect
      id="rect-0"
      y="0"
      x="0"
      height="200"
      width="200"
      fill="none"
      stroke="white"
      stroke-opacity="0"
      overflow="visible"
      />

    <use href="#rect-1" transform="rotate (-25)" />
    <use href="#rect-2" transform="rotate (-25)" />

    <path
      id="path-2"
      fill="LightCyan"
      fill-rule="evenodd"
      stroke="Blue"
      stroke-width="8"
