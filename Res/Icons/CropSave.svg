<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- license: http://creativecommons.org/licenses/publicdomain -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  id="Crop"
  viewBox="0 0 200 200"
  x="0"
  y="0">
  <g
    id="graphics-1">

    <!-- outer dark gray rectangle -->
    <rect
      id="rect-1"
      x="5"
      y="5"
      height="180"
      width="180"
      fill="white"
      fill-rule="evenodd"
      stroke="DarkGray"
      stroke-width="12"
      stroke-opacity="0.8"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
      />

    <!-- inner light gray rectangle -->
    <rect
      id="rect-2"
      x="20"
      y="20"
      width="150"
      height="150"
      fill="LightGray"
      fill-rule="evenodd"
      stroke="white"
      stroke-width="10"
      stroke-opacity="0.2"
      stroke-linecap="square"
      stroke-linejoin="round"
      stroke-miterlimit="0"
    />

    <!-- dark blue angle -->
    <path
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="RoyalBlue"
      stroke="black"
      d="m 110 160
         h 20
         v -130
         h -110
         v 20
         H 110
         Z"
      id="path-1"
    />

    <!-- light blue angle -->
    <path
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="LightSkyBlue"
      stroke="black"
      d="m 50 55
         h -20
         v 100
         h 75
         v -20
         h -55
         z"
      id="path-2"
      />

    <!-- light blue rectangle -->
    <rect
      id="rect-1"
      x="135"
      y="135"
      height="20"
      width="20"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="LightSkyBlue"
      stroke="black"
    />

    <!-- royal blue rectangle -->
    <rect
      id="rect-2"
      x="30"
      y="5"
      height="20"
      width="20"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-width="3"
      stroke-miterlimit="4"
      fill="RoyalBlue"
      stroke="black"
    />
  </g>

  <!-- green save as arrow -->
  <defs
    id="defs-1">
    <radialGradient
      id="radial-1"
      cx="175"
      cy="158"
      r="30"
      gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fff" />
      <stop offset="0.1"  stop-color="#d6ffb1" />
      <stop offset="0.18" stop-color="#aeff66" />
      <stop offset="0.26" stop-color="#92ff2f" />
      <stop offset="0.31" stop-color="#80ff0d" />
      <stop offset="0.34" stop-color="#79ff00" />
      <stop offset="1.0"  stop-color="#008300" />
    </radialGradient>
  </defs>

  <g
    id="layer-1">
    <path
      stroke="Green"
      stroke-width="8"
      stroke-opacity="0.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="url(#radial-1)"
      paint-order="stroke fill"
      d="m 185 175
         h -50
         l 50 -50
         z"
    />
  </g>

</svg>
