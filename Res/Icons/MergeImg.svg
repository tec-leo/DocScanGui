<svg
   width="200"
   height="200"
   viewBox="0 0 200 200"
   id="Grid"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Lines for text document -->
  <g
    id="layer-1">
    <rect x="0" y="0" width="200" height="200" fill="white" />

    <defs>
      <g id="line-def-1" >
        <line
          x1="0" y1="0" x2="65" y2="0"
          stroke-linecap="round"
          stroke-width="12"
          stroke="darkgray" />
        />
      </g>
    </defs>

    <!-- page on the left -->
    <path
      id="path-1"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="10"
      stroke="black"
      fill="none"
      d="M 5 5
         h 85
         v 190
         h -85"
    />

    <use href="#line-def-1" transform="translate (5,  35)" />
    <use href="#line-def-1" transform="translate (5,  60)" />
    <use href="#line-def-1" transform="translate (5, 140)" />
    <use href="#line-def-1" transform="translate (5, 165)" />

    <!-- page on the right -->
    <path
      id="path-2"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="10"
      stroke="black"
      fill="none"
      d="M 195 5
         h -85
         v 190
         h 85"
      />

    <use href="#line-def-1" transform="translate (130,  35)" />
    <use href="#line-def-1" transform="translate (130,  60)" />
    <use href="#line-def-1" transform="translate (130, 140)" />
    <use href="#line-def-1" transform="translate (130, 165)" />

    <!-- line for arrow -->
    <line x1="45" y1="100" x2="165" y2="100"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="20"
          stroke="blue" />

    <!-- polygon for arrow -->
    <polygon
      id="poly-1"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-miterlimit="1"

      points="40,100 70,85 70,115"
      stroke-width="18"
      stroke="blue" />
  </g>
</svg>
<!-- File end -->
